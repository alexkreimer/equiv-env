# Central configuration for equiv-env (Stage 0 spec §6).
# Any change here updates config_hash() and invalidates cached evaluations.

cbmc:
  arch: x86_64
  maxn: 4              # proof bound for candidates (was 8); n > maxn covered by large_tests
  unwind_candidates: [10, 34, 66]
  timeout_s: 60
  fast_prove: true     # on exact-check timeout: abstract var*var as UF + candidate safety run
  exact_timeout_s: 20  # exact-check budget when fast_prove is on
  ub_timeout_s: 30
  memory_limit_gb: 8

dataset:
  allowed_libc:
    - memset
    - memcpy
    - memmove
    - strlen
    - strcmp
    - strncmp
    - strcpy
    - strchr
    - abs
    - labs
    - llabs
  excluded_path_patterns:
    # Compiler regression testsuites (tiny codegen micro-tests, heavy near-duplicates)
    - gcc/testsuite
    - llvm/test
    - clang/test
    # Synthetic / obfuscator-generated benchmarks (random functions, dead loops)
    - tigress
    - obfuscated-programs
    - csmith
  max_per_file: 10
  max_per_repo: 200
  deduplicate: true

tests:
  n_random: 200
  n_heavy: 2000       # in-domain random tests, evaluate(short_circuit=False) only

large_tests:          # differential tests with lengths in (MAXN, bench_n]
  n_random: 64
  bench_n: 512
  seed: 0

speed:
  proxy: callgrind
  arch: armv8.5-a

reward:
  cap: 4.0
  min_gain: 1.05
  base: 0.0

cache:
  path: data/eval_cache.db
